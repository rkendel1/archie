services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: archie
      POSTGRES_USER: archie
      POSTGRES_PASSWORD: archie
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archie -d archie"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5444:5432"
    volumes:
      - archie-postgres:/var/lib/postgresql/data

  archie-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARCHIE_RUNTIME_PORT: 4317
      ARCHIE_DATABASE_URL: postgres://archie:archie@postgres:5444/archie
      ARCHIE_SESSION_STORE_PATH: /workspace/.archie/session.db
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "4317:4317"
    volumes:
      - ./:/workspace

  ollama:
    image: ollama/ollama:latest
    profiles: ["models"]
    ports:
      - "11434:11434"

volumes:
  archie-postgres:
